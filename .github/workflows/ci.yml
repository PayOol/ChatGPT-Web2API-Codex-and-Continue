name: Windows distribution
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      install:
        description: Install the full managed distribution on a fresh runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: python -m pytest -q -m "not e2e"
      - run: python installer/build_release.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-installer
          path: dist/*
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact
  installation:
    if: github.event_name == 'workflow_dispatch' && inputs.install
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Build the executable to test
        run: python installer/build_release.py --output dist
      - name: Install without opening the editor or creating shortcuts
        shell: powershell
        run: |
          $exe=(Get-ChildItem dist\Web2API-Continue-Setup-*.exe).FullName
          & $exe --root "$env:RUNNER_TEMP\Web2API test" --no-launch --no-shortcuts
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          $log=Get-Content "$env:RUNNER_TEMP\Web2API test\logs\install.log" -Raw
          if ([regex]::Matches($log,'ETAPE \[').Count -ne 21 -or $log -notmatch '21/21 etapes \(100%\)') { throw 'Incomplete progress transcript' }
      - name: Inspect all five live MCP catalogs
        shell: powershell
        run: |
          $root="$env:RUNNER_TEMP\Web2API test"
          & "$root\venv\Scripts\python.exe" "$root\app\installer\doctor.py" --root $root --offline --check-tools
          if ($LASTEXITCODE -ne 0) { throw 'Tool diagnostic failed' }
      - name: Launch the actual editor and load the Continue model without launcher environment
        run: python tests/editor_runtime.py --root "${{ runner.temp }}/Web2API test"
      - uses: actions/upload-artifact@v4
        with:
          name: Installer-tested-on-Windows
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Installation-progress-log
          path: |
            ${{ runner.temp }}/Web2API test/logs/install.log
            ${{ runner.temp }}/Web2API test/logs/editor-runtime.json
            ${{ runner.temp }}/Web2API test/apps/vscode/data/user-data/logs/**
