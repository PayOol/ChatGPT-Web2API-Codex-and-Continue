name: Windows distribution
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      install:
        description: Install the full managed distribution on a fresh runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: python -m pytest -q -m "not e2e"
      - run: python installer/build_release.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-installer
          path: dist/*
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact
  installation:
    if: github.event_name == 'workflow_dispatch' && inputs.install
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install without opening the editor or creating shortcuts
        shell: powershell
        run: ./installer/Setup.ps1 -InstallRoot "$env:RUNNER_TEMP\Web2API test" -NoLaunch -NoShortcuts
      - name: Inspect all five live MCP catalogs
        shell: powershell
        run: |
          $root="$env:RUNNER_TEMP\Web2API test"
          & "$root\venv\Scripts\python.exe" "$root\app\installer\doctor.py" --root $root --offline --check-tools
